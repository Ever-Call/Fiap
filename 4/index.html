<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Document</title>
</head>
<body>
    <div class="bg-red-500 md:bg-green-500 lg:bg-blue-500">
        Cor muda com o tamanho da tela
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="bg-gray-200 p-4">Item 1</div>
        <div class="bg-gray-200 p-4">Item 2</div>
        <div class="bg-gray-200 p-4">Item 3</div>
    </div>
    <button class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded transition duration-500">
        Hover me
    </button>

    <div class="w-16 mt-10 h-16 bg-purple-500 animate-bounce"></div>

    <div class="max-w-sm mx-auto mt-10 p-6 bg-white rounded-xl shadow-md hover:shadow-xl hover:scale-105 transition duration-500">
        <h2 class="text-xl font-bold text-gray-900">Título do Card</h2>
        <p class="mt-2 text-gray-600">Esse é um exemplo de card animado e responsivo com Tailwind CSS.</p>
    </div>
</body>
</html>
